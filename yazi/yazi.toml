[mgr]
sort_dir_first = true
sort_by = "natural"
sort_sensitive = false
show_hidden = false
linemode = "size_and_mtime"

[preview]
wrap = "no"
tab_size = 2
max_width = 1000
max_height = 1000

[[plugin.prepend_fetchers]]
url = "*"
run = "git"
group = "git"

[[plugin.prepend_fetchers]]
url = "*/"
run = "git"
group = "git"
