interface:
  display_name: "Figma"
  short_description: "Use Figma MCP for design, code, diagrams, and specs"
  icon_small: "./assets/figma-small.svg"
  icon_large: "./assets/figma.png"
  default_prompt: "Use $figma to route the Figma task to the matching playbook and shared quality checks."

dependencies:
  tools:
    - type: "mcp"
      value: "figma"
      description: "Figma MCP server"
      transport: "streamable_http"
      url: "https://mcp.figma.com/mcp"
